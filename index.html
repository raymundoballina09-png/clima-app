
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>App del Clima - API</title>

    <link rel="stylesheet" href="estilos.css">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>">
</head>

<body>

    <header>

        <img src="IMG/banner.png" alt="Banner de la App del Clima" class="banner">

        <h1>🌤️ App del Clima</h1>

        <p>Consulta el clima en tiempo real de cualquier ciudad</p>

    </header>

    <main>

        <!-- BUSCADOR -->
        <form id="formulario" class="buscador">

            <input
                type="text"
                id="inputCiudad"
                placeholder="Escribe una ciudad..."
                required
            >

            <button type="submit">🔍 Consultar</button>

        </form>

        <!-- BOTONES ADICIONALES -->
        <div class="botones-extra">

            <button type="button" onclick="obtenerUbicacion()">
                📍 Usar mi ubicación
            </button>

            <button type="button" onclick="pronostico()">
                📅 Pronóstico de 5 días
            </button>

            <button type="button" onclick="cambiarTema()">
    🌙 Cambiar tema
</button>

<button type="button" onclick="compartirWhatsApp()">
    📱 Compartir en WhatsApp
</button>

        </div>

        <!-- MENSAJES -->
        <p id="estado"></p>

        <!-- RESULTADO DEL CLIMA -->
        <div id="resultado" class="resultado"></div>

        <!-- PRONOSTICO -->
        <div id="pronostico"></div>

        <!-- HISTORIAL -->
        <section class="seccion-historial">

            <h2>🕘 Historial de búsquedas</h2>

            <p>Presiona una ciudad para consultar su clima otra vez.</p>

            <div id="historial"></div>

        </section>

    </main>

    <footer>

        <p>&copy; 2026 - App del Clima | Datos de OpenWeatherMap</p>

        <p>Banner diseñado en Canva 🎨</p>

    </footer>

    <script src="scrip.js"></script>

</body>

</html>
